name: Course repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate course structure
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f LICENSE
          test -d assignments
          test -d activities
          test -d projects
          test -d templates/example-repository
          test -f templates/example-repository/README.md
          echo "Course repository structure is valid."
