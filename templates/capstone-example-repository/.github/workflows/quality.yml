name: Capstone quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CI dependencies
        run: python -m pip install --upgrade pip && python -m pip install pandas jupyter nbconvert nbclient pytest
      - name: Run tests
        run: PYTHONPATH=src python -m pytest
      - name: Execute notebooks
        run: >-
          jupyter nbconvert --to notebook --execute
          notebooks/01-capstone-question.ipynb
          --output /tmp/01-capstone-question.executed.ipynb
          --ExecutePreprocessor.timeout=120
          --ExecutePreprocessor.kernel_name=python3
